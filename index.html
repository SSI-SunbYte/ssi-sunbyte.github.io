<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Control</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f6f4;--card:#fff;--tx:#17181a;--mu:#6b6e75;--bd:#e2e2de;--ac:#e5871f;--ok:#1f9d55;--warn:#d98a00;--bad:#d03a3a;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e10;--card:#17191c;--tx:#ecece8;--mu:#8d9097;--bd:#2a2d31;--ac:#f69c41;--ok:#3ecf7e;--warn:#f0b429;--bad:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0e10;--card:#17191c;--tx:#ecece8;--mu:#8d9097;--bd:#2a2d31;--ac:#f69c41;--ok:#3ecf7e;--warn:#f0b429;--bad:#ff6b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:#0d0e10;color:#ecece8;z-index:5}
.logo{height:52px;width:auto;display:block}.biz{display:none}
nav button{background:transparent;border-color:#3a3d42;color:#ecece8}nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#thm{background:transparent;border-color:#3a3d42;color:#ecece8;white-space:nowrap}
nav{display:flex;gap:4px;margin-left:auto}
button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;max-width:100%}
main{max-width:1100px;margin:0 auto;padding:20px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:26px 0 10px}
.banner{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px}
.banner.good{border-left-color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.mu{color:var(--mu);font-size:13px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:start}
main.wide{max-width:none}
.task input,.task select,.task textarea{max-width:100%;min-width:0}.task .acts input{flex:1 1 80px;min-width:0}.task{overflow:hidden}
@media(max-width:1100px){.cols{grid-template-columns:repeat(3,minmax(0,1fr))}}
.col.blkcol{border-color:var(--bad)}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
.col{background:color-mix(in srgb,var(--card) 60%,transparent);border:1px dashed var(--bd);border-radius:12px;padding:10px;min-height:120px}
.task{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:8px}
.task.blk{border-color:var(--bad)}
.task{cursor:grab;-webkit-touch-callout:none}.task.drag{opacity:.4}.col.over{outline:2px dashed var(--ac);outline-offset:-2px}
.task .acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.task .acts button{padding:2px 8px;font-size:13px}
form.f{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
details{margin-top:26px}summary{cursor:pointer;color:var(--mu)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;flex:none}
.tb{width:100%;border-collapse:collapse;min-width:680px}.tb th,.tb td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}.tb th{font-size:12px;color:var(--mu);font-weight:500}.tb tr:last-child td{border-bottom:0}.tb td.n,.tb th:nth-child(n+4){text-align:right}
.pg{display:flex;align-items:center;gap:8px}
.sp{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bd)}.sp.r{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}.sp.o{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}.sp.g{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.it{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.ini{font-size:11px;background:var(--bd);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.tlbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.seg{display:flex;gap:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}.legend i{display:inline-block;width:18px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.tlwrap{max-height:72vh;overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}
.tlhd{display:flex;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
.tlhd .tl{height:76px;align-items:flex-end;justify-content:space-between;padding-bottom:8px;z-index:6}
.hc{position:relative;flex:none;height:76px}
.bn{position:absolute;top:0;height:22px;font-size:12px;font-weight:600;padding:3px 8px;white-space:nowrap;overflow:hidden;background:color-mix(in srgb,var(--bc) 30%,var(--bg))}
.holiday{--bc:var(--ok)}.exam{--bc:var(--warn)}
.wk{position:absolute;top:26px;font-size:11px;padding-left:6px;border-left:1px solid var(--bd);display:flex;flex-direction:column;line-height:1.25;color:var(--mu)}.wk b{color:var(--tx)}
.ms{position:absolute;top:56px;font-size:12px;color:#a78bfa;white-space:nowrap;background:color-mix(in srgb,#a78bfa 18%,var(--bg));padding:1px 6px;border-radius:4px}
.tdy{position:absolute;top:56px;font-size:12px;background:#3b82f6;color:#fff;padding:1px 8px;border-radius:99px;z-index:2}
.lay{position:absolute;top:0;bottom:0;pointer-events:none}.bl{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--bc) 12%,transparent)}
.tline{position:absolute;top:0;bottom:0;border-left:2px dashed #3b82f6}
.tr{display:flex;height:36px;border-bottom:1px solid var(--bd);position:relative}
.tl{position:sticky;left:0;z-index:3;width:var(--lw);flex:none;background:var(--bg);display:flex;align-items:center;gap:8px;padding:0 10px;border-right:1px solid var(--bd);overflow:hidden}
.th .tl{background:var(--card);font-weight:600}.th{background:color-mix(in srgb,var(--card) 70%,transparent)}
.tc{position:relative;flex:none}.tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ow{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dd{text-decoration:line-through;opacity:.55}
.tb2{position:absolute;top:8px;height:20px;border-radius:5px}
.tb2.lt{background-color:color-mix(in srgb,var(--bad) 45%,var(--bg));border:1px solid var(--bad)}.tb2.dn{opacity:.35}
.tb2.pl{background:transparent;border:1px dashed var(--mu)}
.tb2.bk{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px)}
.lb{position:absolute;top:9px;font-size:13px;white-space:nowrap}
</style></head><body>

<main id="m"></main>
<script>
const KEY="mission-control-v1",API_URL="https://mission-control-api.onrender.com",DAY=864e5,ST=["backlog","todo","doing","review","done"],SL={backlog:"Backlog",todo:"To do",doing:"In progress",review:"In review",done:"Done",blocked:"⚑ Blocked"};
const iso=d=>d.toISOString().slice(0,10),today=()=>new Date(iso(new Date())),uid=()=>Math.random().toString(36).slice(2,9);
const days=(a,b)=>Math.round((new Date(a)-new Date(b))/DAY);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const t0=iso(today());
let S={name:"My Business",teams:[{id:"t1",name:"Operations"},{id:"t2",name:"Marketing"},{id:"t3",name:"Product"}],
milestones:[{id:"m1",name:"Launch",date:iso(new Date(+today()+60*DAY)),team:""}],
tasks:[{id:"k1",title:"Example: draft launch plan",team:"t1",status:"doing",end:iso(new Date(+today()+10*DAY)),blocked:false},
{id:"k2",title:"Example: overdue task",team:"t2",status:"todo",end:iso(new Date(+today()-5*DAY)),blocked:false}]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
let saveTimer=null,loadingSharedState=true,saveRevision=0;
const save=()=>{
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(loadingSharedState)return;
  const revision=++saveRevision;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      const response=await fetch(API_URL+"/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:S})});
      if(!response.ok)throw new Error("HTTP "+response.status);
    }catch(e){console.error("Mission Control could not sync shared data. Check that the Python API is deployed and reachable.",e)}
  },250);
};
const eff=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
const paint=()=>{const b=document.getElementById('thm');if(b)b.textContent=eff()==='dark'?'☀️ Light':'🌙 Dark'};
function toggleTheme(){const n=eff()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('mc-theme',n)}catch(e){}paint()}
try{const t=localStorage.getItem('mc-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
paint();
let view="over",filter="",bmode="cur",tlT="",tlR="cur",tlD="n",tlH=false,tlScroll=0;
const tn=id=>(S.teams.find(t=>t.id===id)||{name:"—"}).name;
const PALG=['#9aa3b2','#ff7a2f','#18b8d8','#7ecb20','#f0488c','#8b5cf6','#22a96b'];
S.teams.forEach((t,i)=>{if(!t.color)t.color=PALG[i%PALG.length]});
S.bands=S.bands||[];
S.people=S.people||['William','Reuben','Anya','Midum','Maira','Pulastya','Aimee','Baffny','Saleh','Tony','Keegan','Sakeen','Vaadish','Charlotte','Anna','Thomas','Pengfei','Bogdan'];
const ownOpts=cur=>'<option value="">👤 Unassigned</option>'+[...S.people,...(cur&&!S.people.includes(cur)?[cur]:[])].map(p=>`<option ${p===cur?'selected':''}>${esc(p)}</option>`).join('');
const tc=id=>(S.teams.find(t=>t.id===id)||{color:'#999'}).color;
function stats(tid){const ts=S.tasks.filter(t=>t.team===tid),open=ts.filter(t=>t.status!=="done");
const done=ts.length-open.length,pct=ts.length?Math.round(done/ts.length*100):0;
const late=open.filter(t=>t.end&&t.end<t0).map(t=>days(t0,t.end));
return{ts,open,pct,blocked:open.filter(t=>t.blocked).length,behind:late.length?Math.max(...late):0,noEnd:open.filter(t=>!t.end).length}}
function render(){
S.tasks.forEach(t=>{if(t.status==="done"){if(!t.doneAt)t.doneAt=t0}else delete t.doneAt});
document.getElementById("biz").textContent=S.name;
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
const m=document.getElementById("m");m.className=view==="board"?"wide":"";
m.innerHTML=view==="over"?over():view==="teams"?teams():view==="tl"?timeline():view==="board"?board():setup();
if(view==="tl"){const w=document.querySelector(".tlwrap");if(w)w.scrollLeft=tlScroll}save()}
function over(){
const all=S.teams.map(t=>({t,s:stats(t.id)})),beh=all.filter(x=>x.s.behind>0).length,noEnd=all.reduce((a,x)=>a+x.s.noEnd,0);
let h=`<div class="banner ${beh?"":"good"}">${beh?`<b>${beh} of ${S.teams.length} teams</b> have overdue work.`:"All teams are on plan."} ${noEnd?`${noEnd} open task${noEnd>1?"s have":" has"} no end date, so ${noEnd>1?"they are":"it is"} invisible to the forecast.`:""}</div><h2>Milestones</h2><div class="grid">`;
[...S.milestones].sort((a,b)=>a.date.localeCompare(b.date)).forEach(ms=>{
const open=S.tasks.filter(t=>t.status!=="done"&&t.end&&(!ms.team||t.team===ms.team)),last=open.map(t=>t.end).sort().pop();
let note='<span class="mu">No work linked</span>';
if(last){const sp=days(ms.date,last);note=sp>=0?`<span class="ok">${sp} days spare</span>`:`<span class="bad">${-sp} days late</span>`}
h+=`<div class="card" ${ms.team?`style="border-top:4px solid ${tc(ms.team)}"`:""}><b>${esc(ms.name)}</b><div class="mu">${fmt(ms.date)}${ms.team?" · "+esc(tn(ms.team)):""}</div>${note}</div>`});
h+=`</div><h2>Teams</h2><div class="grid">`;
all.forEach(({t,s})=>{h+=`<div class="card" style="border-top:4px solid ${tc(t.id)}"><div class="row"><b><i class="dot" style="background:${tc(t.id)}"></i>${esc(t.name)}</b><span class="pill ${s.behind?"bad":"ok"}">${s.behind?"Behind":"On plan"}</span></div>
<div class="bar"><i style="width:${s.pct}%;background:${tc(t.id)}"></i></div><div class="mu">${s.pct}% done · ${s.open.length} open${s.blocked?` · ${s.blocked} blocked`:""}</div>
${s.behind?`<div class="bad mu">${s.behind} days behind plan</div>`:""}${!s.ts.length?'<div class="mu">No tasks yet</div>':""}</div>`});
return h+"</div>"}
function teams(){
const PAL=['#9aa3b2','#ff7a2f','#18b8d8','#7ecb20','#f0488c','#8b5cf6','#22a96b'],colOf=id=>{const i=S.teams.findIndex(x=>x.id===id);return i<0?'#999':(S.teams[i].color||PAL[i%PAL.length])};
const rows=S.teams.map(t=>({t,s:stats(t.id)})),op=S.tasks.filter(t=>t.status!=='done'),dated=op.filter(t=>t.end).length,cov=op.length?Math.round(dated/op.length*100):0;
const stt=s=>!s.ts.length?['At risk','o']:s.behind>0?['Behind schedule','r']:(s.blocked||s.noEnd)?['At risk','o']:['On track','g'];
const sd=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const ini=n=>(n||'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const pl=t=>t.blocked?['Blocked','r']:t.status==='doing'?['In progress','o']:[SL[t.status],''];
const item=(t,right)=>`<div class="it" style="border-left:4px solid ${colOf(t.team)}"><i class="dot" style="background:${colOf(t.team)}"></i><div style="flex:1;min-width:0"><div>${esc(t.title)}</div><div class="mu">${esc(tn(t.team))}</div></div>${right}</div>`;
const blk=op.filter(t=>t.blocked),beh=op.filter(t=>t.end&&t.end<t0).map(t=>({t,d:days(t0,t.end)})).sort((a,b)=>b.d-a.d);
let h=`<h1 style="margin:0 0 6px;font-size:30px">Sub-team breakdown</h1><p class="mu" style="max-width:640px">${dated} of ${op.length} open tasks carry a planned end date (${cov}% coverage). An undated task cannot be forecast, cannot be late, and cannot warn the teams waiting on it.</p><h2>Per sub-team</h2><div class="card" style="padding:0;overflow-x:auto"><table class="tb"><tr><th>Sub-team</th><th>Status</th><th>Progress</th><th>Open</th><th>Blocked</th><th>Undated</th><th>Vs plan</th><th>Finishes</th></tr>`;
rows.forEach(({t,s})=>{const [sl,sc]=stt(s),last=s.open.filter(x=>x.end).map(x=>x.end).sort().pop();
h+=`<tr><td><i class="dot" style="background:${colOf(t.id)}"></i>${esc(t.name)}</td><td><span class="sp ${sc}">${sl}</span></td><td>${s.ts.length?`<div class="pg"><div class="bar" style="width:90px;margin:0"><i style="width:${s.pct}%;background:${colOf(t.id)}"></i></div><span class="mu">${s.pct}%</span></div>`:'<span class="mu">No tasks</span>'}</td><td class="n">${s.open.length}</td><td class="n ${s.blocked?'bad':'mu'}">${s.blocked}</td><td class="n ${s.noEnd?'warn':'mu'}">${s.noEnd}</td><td class="n ${s.behind?'bad':'mu'}">${s.behind?'+'+s.behind+'d':'—'}</td><td class="n">${last?sd(+new Date(last)+s.behind*DAY):'—'}</td></tr>`});
h+=`</table></div><div class="two"><div><h2>Blocked (${blk.length})</h2>${blk.map(t=>item(t,t.owner?`<span class="ini">${esc(ini(t.owner))}</span>`:'')).join('')||'<p class="mu">Nothing blocked.</p>'}</div><div><h2>Behind plan (${beh.length})</h2>${beh.map(({t,d})=>{const [l,c]=pl(t);return item(t,`<span class="sp ${c}">${l}</span><b class="bad">+${d}d</b>`)}).join('')||'<p class="mu">Nothing behind plan.</p>'}</div></div>`;
return h}
function timeline(){
const pd={c:9,n:16,w:26}[tlD],LW=innerWidth<700?190:280;
const mon=d=>{const x=new Date(d);return new Date(+x-((x.getUTCDay()+6)%7)*DAY)};
const wkn=d=>{const t=new Date(d);t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y=Date.UTC(t.getUTCFullYear(),0,1);return Math.ceil(((t-y)/DAY+1)/7)};
const ds=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const cnt={},ids={};S.tasks.forEach(t=>{const p=(tn(t.team).replace(/[^A-Za-z]/g,'').slice(0,3)||'TSK').toUpperCase();cnt[t.team]=(cnt[t.team]||0)+1;ids[t.id]=p+'-'+cnt[t.team]});
const se=t=>{const e=t.end||null;return [t.start||(e?iso(new Date(+new Date(e)-6*DAY)):null),e]};
let from,to;
if(tlR==='cur'){from=mon(+today()-7*DAY);to=new Date(+from+98*DAY)}
else{const a=[t0];S.tasks.forEach(t=>{const [s,e]=se(t);s&&a.push(s);e&&a.push(e)});S.milestones.forEach(m=>a.push(m.date));S.bands.forEach(b=>a.push(b.start,b.end));a.sort();from=mon(+new Date(a[0])-7*DAY);to=new Date(+new Date(a[a.length-1])+14*DAY)}
const nw=Math.ceil(days(to,from)/7)+1,W=nw*7*pd,X=d=>days(d,from)*pd;
tlScroll=Math.max(X(t0)-100,0);
let rows='',shown=0;
S.teams.filter(t=>!tlT||t.id===tlT).forEach(tm=>{
let ts=S.tasks.filter(t=>t.team===tm.id&&!(tlH&&t.status==='done'));
if(tlR==='cur')ts=ts.filter(t=>{const [s,e]=se(t);return !e||(e>=iso(from)&&s<=iso(to))});
ts.sort((a,b)=>(a.status==='done')-(b.status==='done')||(a.end||'9').localeCompare(b.end||'9'));
shown+=ts.length;
const ss=ts.map(se).filter(x=>x[1]),mn=ss.length?ss.map(x=>x[0]).sort()[0]:null,mx=ss.length?ss.map(x=>x[1]).sort().pop():null;
rows+=`<div class='tr th'><div class='tl'><i class='dot' style='background:${tm.color}'></i><b>${esc(tm.name)}</b><span class='pill' style='margin-left:auto'>${ts.length}</span></div><div class='tc' style='width:${W}px'>${mn?`<div class='tb2' style='left:${X(mn)}px;width:${Math.max((days(mx,mn)+1)*pd,8)}px;background-color:${tm.color};opacity:.55;height:8px;top:14px'></div>`:''}</div></div>`;
ts.forEach(t=>{
const [s,e]=se(t),done=t.status==='done',late=!done&&e&&e<t0,ld=late?days(t0,e):0;
let bar='',lx=X(t0)+28,txt=esc(t.title);
if(!e){bar=`<div class='tb2' style='left:${X(t0)}px;width:18px;background-color:var(--bd)'></div>`;txt+=" <span class='mu'>· no end date</span>"}
else{const l=X(s),w=Math.max((days(e,s)+1)*pd,12),bw=late?Math.max((days(t0,s)+1)*pd,12):w;
bar=(late?`<div class='tb2 pl' style='left:${l}px;width:${w}px'></div>`:'')+`<div class='tb2 ${late?'lt':done?'dn':''} ${t.blocked&&!done?'bk':''}' style='left:${l}px;width:${bw}px;${late?'':'background-color:'+tm.color}'></div>`;
lx=l+Math.max(w,bw)+8;txt=(t.blocked&&!done?'Blocked · ':'')+txt+(late?` · <b class='bad'>${ld} days late</b>`:'')}
rows+=`<div class='tr'><div class='tl'><span class='mu' style='width:54px;flex:none'>${ids[t.id]}</span><span class='tt ${done?'dd':''}'>${esc(t.title)}</span><span class='mu ow'>${esc(t.owner||'')}</span></div><div class='tc' style='width:${W}px'>${bar}<span class='lb ${done?'dd':''}' style='left:${lx}px'>${txt}</span></div></div>`})});
let wks='';for(let i=0;i<nw;i++){const d=new Date(+from+i*7*DAY);wks+=`<div class='wk' style='left:${i*7*pd}px;width:${7*pd}px'><b>Wk ${wkn(d)}</b><span>${ds(d)}</span></div>`}
const bw2=b=>`left:${X(b.start)}px;width:${(days(b.end,b.start)+1)*pd}px`;
const hdr=`<div class='tlhd'><div class='tl'><span>Sub-team / task</span><span>Who</span></div><div class='hc' style='width:${W}px'>${S.bands.map(b=>`<div class='bn ${b.type}' style='${bw2(b)}'>${esc(b.name)}</div>`).join('')}${wks}${S.milestones.map(m=>`<div class='ms' style='left:${X(m.date)}px'>◆ ${esc(m.name)}</div>`).join('')}<div class='tdy' style='left:${Math.max(X(t0)-10,0)}px'>Today</div></div></div>`;
const lay=`<div class='lay' style='left:${LW}px;width:${W}px;background-image:linear-gradient(to right,var(--bd) 1px,transparent 1px);background-size:${7*pd}px 100%'>${S.bands.map(b=>`<div class='bl ${b.type}' style='${bw2(b)}'></div>`).join('')}<div class='tline' style='left:${X(t0)+pd/2}px'></div></div>`;
const bar2=`<div class='tlbar'><label>Sub-team <select id='tlt'><option value=''>All teams</option>${S.teams.map(t=>`<option value='${t.id}' ${tlT===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label>Range <select id='tlr'><option value='cur' ${tlR==='cur'?'selected':''}>Current</option><option value='all' ${tlR==='all'?'selected':''}>All</option></select></label><span class='seg'>${[['c','Compact'],['n','Normal'],['w','Wide']].map(([k,l])=>`<button data-a='tld' data-m='${k}' class='${tlD===k?'on':''}'>${l}</button>`).join('')}</span><label><input type='checkbox' id='tlh' ${tlH?'checked':''}> Hide completed</label><span class='mu'>${shown} shown</span></div><div class='legend mu'><span><i style='background:color-mix(in srgb,var(--bad) 45%,var(--bg));border:1px solid var(--bad)'></i>running late</span><span><i style='border:1px dashed var(--mu)'></i>planned dates</span><span><i style='background:var(--mu);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.4) 0 4px,transparent 4px 8px)'></i>blocked</span><span><i style='background:var(--ok)'></i>holidays</span><span><i style='background:var(--warn)'></i>exams</span><span><i style='background:#3b82f6;width:3px'></i>today</span><span><i style='background:#a78bfa;width:10px'></i>milestone</span></div>`;
return bar2+`<div class='tlwrap'><div class='tlin' style='min-width:${LW+W}px;--lw:${LW}px;position:relative'>${hdr}<div style='position:relative'>${lay}${rows}</div></div></div>`}
function board(){
let h=`<div class="row"><div style="display:flex;gap:4px"><button data-a="bm" data-m="cur" class="${bmode==="cur"?"on":""}">Current</button><button data-a="bm" data-m="all" class="${bmode==="all"?"on":""}">All</button></div><select id="flt"><option value="">All teams</option>${S.teams.map(t=>`<option value="${t.id}" ${filter===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div>
<form class="f" id="addt"><input name="title" placeholder="New task" required style="flex:1;min-width:160px"><select name="team">${S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><select name="status" title="Column">${ST.filter(s=>s!=="done").map(s=>`<option value="${s}" ${s==="todo"?"selected":""}>${SL[s]}</option>`).join("")}</select><select name="owner" title="Responsible person">${ownOpts("")}</select><input type="date" name="start" title="Start date"><input type="date" name="end" title="End date"><button class="pri">Add task</button></form><div class="cols" style="margin-top:14px">`;
[...ST,"blocked"].forEach((st,i)=>{const ts=S.tasks.filter(t=>(st==="blocked"?t.blocked&&t.status!=="done":t.status===st&&(!t.blocked||st==="done"))&&(!filter||t.team===filter)&&(bmode==="all"||t.status!=="done"||days(t0,t.doneAt||t0)<=7));
h+=`<div class="col ${st==="blocked"?"blkcol":""}" data-col="${st}"><b>${SL[st]}</b> <span class="mu">${ts.length}${st==="done"&&bmode!=="all"?" · last 7 days":""}</span>`;
ts.forEach(t=>{const late=t.status!=="done"&&t.end&&t.end<t0;
h+=`<div class="task ${t.blocked?"blk":""}" style="border-left:5px solid ${tc(t.team)}" draggable="true" data-tid="${t.id}"><div>${esc(t.title)}</div><div class="mu" style="display:flex;align-items:center;gap:4px"><i class="dot" style="background:${tc(t.team)};margin-right:2px"></i><select data-a="team" data-id="${t.id}" title="Responsible sub-team" style="flex:1;min-width:0;padding:2px 6px;font-size:13px">${S.teams.map(x=>`<option value="${x.id}" ${x.id===t.team?"selected":""}>${esc(x.name)}</option>`).join("")}</select>${t.blocked?'<span class="bad">Blocked</span>':""}</div>
<div style="margin:4px 0"><select data-a="own" data-id="${t.id}" title="Responsible person" style="width:100%;padding:2px 8px;font-size:13px">${ownOpts(t.owner)}</select></div><div style="margin:4px 0"><textarea data-a="note" data-id="${t.id}" rows="2" placeholder="📝 Notes" style="width:100%;background:var(--card);color:inherit;border:1px solid var(--bd);border-radius:8px;padding:4px 8px;font:inherit;font-size:13px;resize:vertical">${esc(t.notes||"")}</textarea></div><div class="mu ${late?"bad":""}">${t.end?"Due "+fmt(t.end):"No end date"}${late?" (overdue)":""}</div>
<div class="acts">${i>0&&i<ST.length?`<button data-a="mv" data-id="${t.id}" data-d="-1">◀</button>`:""}${i<ST.length-1?`<button data-a="mv" data-id="${t.id}" data-d="1">▶</button>`:""}
${st!=="done"?`<button data-a="blk" data-id="${t.id}">${t.blocked?"Unblock":"⚑ Block"}</button>`:""}<input type="date" value="${t.start||""}" data-a="start" title="Start date" style="padding:1px 4px;font-size:13px"><input type="date" value="${t.end||""}" title="End date" data-a="end" data-id="${t.id}" style="padding:1px 4px;font-size:13px"><button data-a="del" data-id="${t.id}">✕</button></div></div>`});
h+="</div>"});return h+"</div>"}
function setup(){
return `<h2>Business name</h2><form class="f" id="fn"><input name="n" value="${esc(S.name)}" required><button class="pri">Save</button></form>
<h2>Teams</h2><div>${S.teams.map(t=>`<div class="row card" style="margin-bottom:6px"><span><i class="dot" style="background:${tc(t.id)}"></i>${esc(t.name)}</span><span><input type="color" value="${tc(t.id)}" data-a="col" data-id="${t.id}" title="Team colour" style="padding:0;width:40px;height:30px"> <button data-a="dt" data-id="${t.id}">Remove</button></span></div>`).join("")}</div>
<form class="f" id="ft"><input name="n" placeholder="New team" required><button class="pri">Add team</button></form>
<h2>Milestones</h2><div>${S.milestones.map(x=>`<div class="row card" style="margin-bottom:6px"><span>${esc(x.name)} · ${fmt(x.date)}${x.team?" · "+esc(tn(x.team)):""}</span><button data-a="dm" data-id="${x.id}">Remove</button></div>`).join("")}</div>
<form class="f" id="fm"><input name="n" placeholder="Milestone name" required><input type="date" name="d" required><select name="t"><option value="">All teams</option>${S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><button class="pri">Add milestone</button></form>
<h2>People</h2><p class='mu'>These names appear in each task's Responsible dropdown.</p><div style='display:flex;gap:6px;flex-wrap:wrap'>${S.people.map(p=>`<span class='pill'>${esc(p)} <button data-a='dp' data-id='${esc(p)}' title='Remove' style='padding:0 6px;border:0;background:transparent'>✕</button></span>`).join('')}</div><form class='f' id='fp'><input name='n' placeholder='Add a person' required><button class='pri'>Add person</button></form>
<h2>Calendar bands</h2><p class='mu'>Holidays and exams are shaded on the Timeline.</p><div>${S.bands.map(x=>`<div class='row card' style='margin-bottom:6px'><span>${esc(x.name)} · ${fmt(x.start)} – ${fmt(x.end)} · ${x.type}</span><button data-a='db' data-id='${x.id}'>Remove</button></div>`).join('')}</div><form class='f' id='fb'><input name='n' placeholder='Name, e.g. Christmas holidays' required><input type='date' name='s' required><input type='date' name='e' required><select name='ty'><option value='holiday'>Holiday</option><option value='exam'>Exam</option></select><button class='pri'>Add band</button></form>
<details><summary>Reset everything</summary><button data-a="reset" style="margin-top:8px">Delete all data</button></details>
<p class="mu">Data is saved in this browser only.</p>`}
document.addEventListener("click",e=>{
const n=e.target.closest("nav button");if(n){view=n.dataset.v;return render()}
const b=e.target.closest("[data-a]");if(!b||b.tagName==="INPUT"||b.tagName==="TEXTAREA"||b.tagName==="SELECT")return;
const a=b.dataset.a,id=b.dataset.id,t=S.tasks.find(x=>x.id===id);
if(a==="thm"){toggleTheme();return}
else if(a==="tld")tlD=b.dataset.m;
else if(a==="dp")S.people=S.people.filter(x=>x!==id);
else if(a==="db")S.bands=S.bands.filter(x=>x.id!==id);
else if(a==="bm")bmode=b.dataset.m;
else if(a==="mv"){t.status=ST[ST.indexOf(t.status)+ +b.dataset.d]}
else if(a==="blk")t.blocked=!t.blocked;
else if(a==="del")S.tasks=S.tasks.filter(x=>x.id!==id);
else if(a==="dt"){S.teams=S.teams.filter(x=>x.id!==id);S.tasks=S.tasks.filter(x=>x.team!==id)}
else if(a==="dm")S.milestones=S.milestones.filter(x=>x.id!==id);
else if(a==="reset"){try{localStorage.removeItem(KEY)}catch(x){}location.reload();return}
render()});
document.addEventListener("change",e=>{
if(e.target.id==="flt"){filter=e.target.value;render()}
else if(e.target.id==="tlt"){tlT=e.target.value;render()}
else if(e.target.id==="tlr"){tlR=e.target.value;render()}
else if(e.target.id==="tlh"){tlH=e.target.checked;render()}
else if(e.target.dataset.a==="start"){S.tasks.find(x=>x.id===e.target.dataset.id).start=e.target.value;render()}
else if(e.target.dataset.a==="end"){S.tasks.find(x=>x.id===e.target.dataset.id).end=e.target.value;render()}
else if(e.target.dataset.a==="note"){S.tasks.find(x=>x.id===e.target.dataset.id).notes=e.target.value;save()}
else if(e.target.dataset.a==="team"){S.tasks.find(x=>x.id===e.target.dataset.id).team=e.target.value;render()}
else if(e.target.dataset.a==="col"){S.teams.find(x=>x.id===e.target.dataset.id).color=e.target.value;render()}
else if(e.target.dataset.a==="own"){S.tasks.find(x=>x.id===e.target.dataset.id).owner=e.target.value.trim();render()}});
document.addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.target),id=e.target.id;
if(id==="addt")S.tasks.push({id:uid(),title:f.get("title"),team:f.get("team"),status:f.get("status")||"todo",start:f.get("start"),end:f.get("end"),owner:f.get("owner")||"",blocked:false});
else if(id==="fn")S.name=f.get("n");
else if(id==="ft")S.teams.push({id:uid(),name:f.get("n"),color:PALG.find(c=>!S.teams.some(t=>t.color===c))||PALG[S.teams.length%PALG.length]});
else if(id==="fp"){const n=f.get("n").trim();if(n&&!S.people.includes(n))S.people.push(n)}
else if(id==="fb")S.bands.push({id:uid(),name:f.get("n"),start:f.get("s"),end:f.get("e"),type:f.get("ty")});
else if(id==="fm")S.milestones.push({id:uid(),name:f.get("n"),date:f.get("d"),team:f.get("t")});
render()});
let dragId=null;
const clr=()=>document.querySelectorAll(".over,.drag").forEach(x=>x.classList.remove("over","drag"));
document.addEventListener("dragstart",e=>{const c=e.target.closest?.(".task");if(!c)return;dragId=c.dataset.tid;e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move";c.classList.add("drag")});
document.addEventListener("dragend",()=>{dragId=null;clr()});
document.addEventListener("dragover",e=>{const col=e.target.closest?.(".col");if(!col||!dragId)return;e.preventDefault();document.querySelectorAll(".over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",e=>{const col=e.target.closest?.(".col");if(!col||!dragId)return;e.preventDefault();
const t=S.tasks.find(x=>x.id===dragId),st=col.dataset.col;dragId=null;if(!t)return;
if(st==="blocked"){t.blocked=true;if(t.status==="done")t.status="todo"}else{t.status=st;t.blocked=false}render()});
document.addEventListener("focusin",e=>{const c=e.target.closest?.(".task");if(c&&e.target.matches("input,textarea,select"))c.draggable=false});
document.addEventListener("focusout",e=>{const c=e.target.closest?.(".task");if(c)c.draggable=true});
let tp=null;
const colAt=(x,y)=>document.elementFromPoint(x,y)?.closest?.(".col");
function tmove(){const g=tp.ghost;g.style.transform=`translate(${tp.x-g.offsetWidth/2}px,${tp.y-24}px)`;const c=colAt(tp.x,tp.y);document.querySelectorAll(".over").forEach(x=>x!==c&&x.classList.remove("over"));c&&c.classList.add("over")}
function tend(drop){if(!tp)return;clearTimeout(tp.timer);if(tp.on){tp.ghost?.remove();const c=drop&&colAt(tp.x,tp.y),t=S.tasks.find(x=>x.id===tp.id);
if(c&&t){const st=c.dataset.col;if(st==="blocked"){t.blocked=true;if(t.status==="done")t.status="todo"}else{t.status=st;t.blocked=false}tp=null;render();return}clr()}tp=null}
document.addEventListener("touchstart",e=>{const c=e.target.closest?.(".task");if(!c||e.target.closest("input,textarea,select,button"))return;const p=e.touches[0];
tp={id:c.dataset.tid,x:p.clientX,y:p.clientY,on:false,ghost:null};
tp.timer=setTimeout(()=>{if(!tp)return;tp.on=true;c.classList.add("drag");const g=c.cloneNode(true);g.style.cssText="position:fixed;left:0;top:0;z-index:99;pointer-events:none;opacity:.9;width:"+c.offsetWidth+"px";document.body.appendChild(g);tp.ghost=g;tmove();navigator.vibrate?.(20)},250)},{passive:true});
document.addEventListener("touchmove",e=>{if(!tp)return;const p=e.touches[0];
if(!tp.on){if(Math.hypot(p.clientX-tp.x,p.clientY-tp.y)>8){clearTimeout(tp.timer);tp=null}return}
e.preventDefault();tp.x=p.clientX;tp.y=p.clientY;tmove()},{passive:false});
document.addEventListener("touchend",()=>tend(true));
document.addEventListener("touchcancel",()=>tend(false));
async function initSharedState(){
  try{
    const response=await fetch(API_URL+"/api/state",{cache:"no-store"});
    if(!response.ok)throw new Error("HTTP "+response.status);
    const result=await response.json();
    if(result.state&&typeof result.state==="object"){
      S=result.state;
    }else{
      // Seed the shared store once from this instance's existing saved data/defaults.
      const response=await fetch(API_URL+"/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:S})});
      if(!response.ok)throw new Error("Could not initialise shared state: HTTP "+response.status);
    }
  }catch(e){
    console.error("Mission Control shared backend is unavailable; using this browser's saved copy for now.",e);
  }finally{
    loadingSharedState=false;
    render();
  }
}
initSharedState();
